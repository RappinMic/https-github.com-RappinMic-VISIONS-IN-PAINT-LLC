<header>
  <div class="header-container">
    <img src="logo.webp" alt="Header Logo" class="header-logo">

    <!-- Larger SVG Brush Stroke Animation -->
    <svg class="paint-stroke" viewBox="0 0 600 180" fill="none">
      <path 
        class="stroke-path"
        d="M 40,130 Q 170,10 300,120 Q 470,200 580,60"
        stroke="#f08030"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="0.6"
      />
    </svg>
  </div>
</header>

<style>
.header-container {
  position: relative;
  width: 600px;
  height: 180px;
  margin: 40px auto;
}
.header-logo {
  display: block;
  height: 150px;
  width: auto;
  margin: 0 auto;
  z-index: 1;
  position: relative;
  filter: drop-shadow(0px 2px 8px #2225);
}
.paint-stroke {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
.stroke-path {
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: drawStroke 2s cubic-bezier(0.77,0,0.175,1) forwards, glide 5s linear 2s infinite;
}
@keyframes drawStroke {
  to { stroke-dashoffset: 0; }
}
@keyframes glide {
  0%   { filter: blur(0px) opacity(1);}
  30%  { filter: blur(1px) opacity(0.8);}
  50%  { filter: blur(2px) opacity(0.5);}
  70%  { filter: blur(1px) opacity(0.8);}
  100% { filter: blur(0px) opacity(1);}
}
</style>
